name: Release
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/release.sh'
      - 'scripts/check-release.py'
      - 'docs/distribution.md'
permissions:
  contents: read
env:
  RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.0' }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, target: x86_64-unknown-linux-gnu}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu}
          - {os: macos-latest, target: aarch64-apple-darwin}
          - {os: macos-15-intel, target: x86_64-apple-darwin}
          - {os: windows-latest, target: x86_64-pc-windows-msvc}
          - {os: windows-11-arm, target: aarch64-pc-windows-msvc}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: cargo build --locked --example harness-fixture
      - name: Test on target platform
        run: |
          suffix=""
          if [ "$RUNNER_OS" = Windows ]; then suffix=".exe"; fi
          H2A_HARNESS_FIXTURE="$PWD/target/debug/examples/harness-fixture$suffix" cargo test --locked --all-targets
      - run: scripts/release.sh "$RELEASE_VERSION" "$RELEASE_TARGET"
        env:
          RELEASE_TARGET: ${{ matrix.target }}
      - name: Verify and execute the extracted release archive
        run: |
          suffix=""
          if [ "$RUNNER_OS" = Windows ]; then suffix=".exe"; fi
          python scripts/check-release.py --version "$RELEASE_VERSION" --target "$RELEASE_TARGET" --fixture "$PWD/target/debug/examples/harness-fixture$suffix"
        env:
          RELEASE_TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: h2a-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/checksums_*.txt
            dist/build_*.txt
            dist/verification_*.json
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: h2a-*
          merge-multiple: true
          path: dist
      - run: gh release create "$RELEASE_VERSION" dist/*.tar.gz dist/checksums_*.txt dist/build_*.txt dist/verification_*.json --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "harness-to-api $RELEASE_VERSION" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
