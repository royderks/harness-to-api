name: Factory validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/factory.py validate
      - run: python3 -m unittest discover -s scripts/tests -v
