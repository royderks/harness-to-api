name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -o bin/h2a ./cmd/h2a
      - name: Run offline demo
        if: runner.os != 'Windows'
        shell: bash
        run: H2A_BIN="$PWD/bin/h2a" ./demo/run.sh --fixture
      - name: Exercise bounded-key CLI and HTTP lifecycle
        if: runner.os != 'Windows'
        run: python3 scripts/check-policies.py
