# Replace h2a.example.com with the hostname of your existing HTTPS endpoint.
id: h2a-demo
display_name: h2a demo
description: Scoped h2a gateway access for a Python client
category: inference
inference_capable: true
credentials:
  - name: api_key
    description: h2a gateway key
    env_vars: [OPENAI_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_key]
endpoints:
  - host: h2a.example.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries:
  - /usr/bin/python3
  - /usr/bin/python3.*
  - /usr/local/bin/python
  - /usr/local/bin/python3.*
